name: Publish action

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Resolve release artifact
        id: release
        shell: bash
        run: |
          mod_id="$(sed -n 's/^mod_id=//p' gradle.properties)"
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          echo "artifact=build/libs/${mod_id}-${mod_version}.jar" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Publish Minecraft mod
        uses: Kira-NT/mc-publish@v3.3.0
        with:
          curseforge-id: 1133580
          modrinth-id: oJsYTCP3
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: |
            build/libs/!(*-@(dev|sources|deobf|javadoc)).jar
            build/libs/*-sources.jar
          version-type: beta
          version: ${{ github.ref_name }}
          loaders: neoforge
          game-versions: '26.1.2'
          java: 25
          name: ""
          changelog: "https://github.com/Buuz135/SmithingTemplateViewer/commits/${{ github.ref_name }}/"
          dependencies: jei(optional)
